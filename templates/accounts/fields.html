{% if form.errors %}<div class="account-alert" role="alert" tabindex="-1"><strong>Revisa los datos indicados.</strong>{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="account-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="store-note">{{ field.help_text }}</div>{% endif %}{% if field.errors %}<div id="{{ field.id_for_label }}_error" class="field-error">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
